<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Converter PDF para JSON no Navegador</title>
    
    <!-- CDN oficial recomendada pela Mozilla (Injeta no escopo global automaticamente) -->
    <script src="https://unpkg.com"></script>
    
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; color: #333; }
        .box { border: 2px dashed #ccc; padding: 25px; text-align: center; background: #fafafa; border-radius: 8px; cursor: pointer; }
        .box:hover { border-color: #0066cc; background: #f0f7ff; }
        #json-output { background: #1e1e1e; color: #7ec699; padding: 15px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; font-family: monospace; max-height: 500px; margin-top: 20px; display: none; }
        .status { margin-top: 15px; font-weight: bold; color: #0066cc; }
    </style>
</head>
<body>

    <h2>📄 Conversor Instantâneo de PDF para JSON</h2>
    <p>Selecione um arquivo PDF para extrair o texto em um formato de objeto JSON estruturado.</p>

    <div class="box" onclick="document.getElementById('pdf-file').click()">
        <span>📁 Clique aqui para selecionar o seu arquivo PDF</span>
        <input type="file" id="pdf-file" accept=".pdf" style="display: none;" />
    </div>

    <div id="status" class="status"></div>
    <pre id="json-output"></pre>

    <script>
        // Captura a biblioteca a partir do escopo global unificado (compatível com todos os navegadores)
        var pdfjsLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib || globalThis.pdfjsLib;
        
        // Define o Worker correspondente à mesma versão da CDN unpkg
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com';

        document.getElementById('pdf-file').addEventListener('change', function(event) {
            var file = event.target.files[0]; // Captura estritamente o arquivo selecionado
            if (!file) return;

            var statusDiv = document.getElementById('status');
            var outputPre = document.getElementById('json-output');
            
            statusDiv.innerText = "⏳ Lendo arquivo e mapeando dados...";
            outputPre.style.display = "none";

            var fileReader = new FileReader();
            fileReader.onload = function() {
                var typedarray = new Uint8Array(this.result);

                // Carrega o documento PDF
                pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
                    
                    var dadosDoPdf = {
                        nomeDoArquivo: file.name,
                        tamanhoBytes: file.size,
                        totalPaginas: pdf.numPages,
                        paginas: []
                    };

                    var promessasDasPaginas = [];

                    for (var i = 1; i <= pdf.numPages; i++) {
                        (function(numeroDaPagina) {
                            var promessa = pdf.getPage(numeroDaPagina).then(function(page) {
                                return page.getTextContent().then(function(textContent) {
                                    
                                    var linhasDaPagina = textContent.items.map(function(item) {
                                        return item.str.trim();
                                    }).filter(function(texto) {
                                        return texto.length > 0;
                                    });

                                    dadosDoPdf.paginas.push({
                                        pagina: numeroDaPagina,
                                        totalLinhas: linhasDaPagina.length,
                                        linhas: líneasDaPagina
                                    });
                                });
                            });
                            promessasDasPaginas.push(promessa);
                        })(i);
                    }

                    Promise.all(promessasDasPaginas).then(function() {
                        dadosDoPdf.paginas.sort(function(a, b) { return a.pagina - b.pagina; });
                        var jsonResultado = JSON.stringify(dadosDoPdf, null, 2);

                        statusDiv.innerText = "✅ PDF convertido com sucesso!";
                        outputPre.innerText = jsonResultado;
                        outputPre.style.display = "block";
                    });

                }).catch(function(erro) {
                    console.error(erro);
                    statusDiv.innerText = "❌ Erro ao ler a estrutura do PDF.";
                });
            };

            fileReader.readAsArrayBuffer(file);
        });
    </script>

</body>
</html>
